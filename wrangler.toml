name = "xr6labshq-portal"
main = "worker.js"
compatibility_date = "2026-11-10"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "GANTI_NAMA_DATABASE_D1_ANDA"
database_id = "GANTI_DATABASE_ID_D1_ANDA"

[vars]
APP_ENV = "production"
ZENODO_COMMUNITY_SLUG = "xr6labshqhub"
ZENODO_SASSI_SLUG = "xr6-bsa-sassi"
FROM_EMAIL = "hq@ac.xr6labs.com"
ZEPTO_API_URL = "https://api.zeptomail.com/v1.1/email"

[triggers]
crons = ["*/30 * * * *"]
